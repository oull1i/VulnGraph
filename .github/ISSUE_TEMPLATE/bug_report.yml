name: Bug report
about: Report a reproducible VulnGraph defect without disclosing private security data
body:
  - type: markdown
    attributes:
      value: "Do not upload confidential SBOMs, secrets, or exploit details."
  - type: input
    id: version
    attributes:
      label: VulnGraph version and Python version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps (use fictional data only)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs observed behavior
    validations:
      required: true
