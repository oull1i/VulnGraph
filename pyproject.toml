[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulngraph"
version = "1.0.0"
description = "Explainable software supply-chain vulnerability triage and dependency mapping"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "VulnGraph Contributors"}]
keywords = ["cybersecurity", "sbom", "vulnerability-management", "osv", "cyclonedx", "fastapi"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[project.scripts]
vulngraph = "vulngraph.cli:main"

[tool.setuptools.packages.find]
include = ["vulngraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
